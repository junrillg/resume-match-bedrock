name: resume-match-bedrock

x-backend: &backend
  image: resume-match-api:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    DJANGO_DEBUG: "true"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run ./scripts/lab up first}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
    MATCH_PROVIDER: bedrock-local
    BEDROCK_LOCAL_ENDPOINT: http://provider:8090
    BEDROCK_MODEL_ID: local-evidence-v1
    AWS_REGION: us-east-1
    AWS_EC2_METADATA_DISABLED: "true"
    LOG_VIEWER_URL: http://127.0.0.1:5080
    POSTGRES_HOST: db
    POSTGRES_DB: ${POSTGRES_DB:?Run ./scripts/lab up first}
    POSTGRES_USER: ${POSTGRES_USER:?Run ./scripts/lab up first}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/lab up first}
    LAB_DEMO_PASSWORD: ${LAB_DEMO_PASSWORD:?Run ./scripts/lab up first}
    RABBITMQ_HOST: broker
    RABBITMQ_USER: lab
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run ./scripts/lab up first}
    OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?Run ./scripts/lab up first}
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://openobserve:5080/api/default/v1/logs
    DOCUMENT_BUCKET: resume-originals
    DOCUMENT_ENDPOINT: http://objectstore:8333
    DOCUMENT_REGION: us-east-1
    DOCUMENT_SCAN_MODE: clamav
    DOCUMENT_RETENTION_DAYS: "90"
    DOCUMENT_ACCESS_KEY: ${OBJECT_API_ACCESS_KEY:?Run ./scripts/lab up first}
    DOCUMENT_SECRET_KEY: ${OBJECT_API_SECRET_KEY:?Run ./scripts/lab up first}
    LAB_SERVICE_NAME: api
  init: true
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  objectstore:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: [sh, /start-storage.sh]
    environment:
      OBJECT_ADMIN_ACCESS_KEY: ${OBJECT_ADMIN_ACCESS_KEY:?Run ./scripts/lab up first}
      OBJECT_ADMIN_SECRET_KEY: ${OBJECT_ADMIN_SECRET_KEY:?Run ./scripts/lab up first}
      OBJECT_API_ACCESS_KEY: ${OBJECT_API_ACCESS_KEY:?Run ./scripts/lab up first}
      OBJECT_API_SECRET_KEY: ${OBJECT_API_SECRET_KEY:?Run ./scripts/lab up first}
      OBJECT_WORKER_ACCESS_KEY: ${OBJECT_WORKER_ACCESS_KEY:?Run ./scripts/lab up first}
      OBJECT_WORKER_SECRET_KEY: ${OBJECT_WORKER_SECRET_KEY:?Run ./scripts/lab up first}
      OBJECT_RELAY_ACCESS_KEY: ${OBJECT_RELAY_ACCESS_KEY:?Run ./scripts/lab up first}
      OBJECT_RELAY_SECRET_KEY: ${OBJECT_RELAY_SECRET_KEY:?Run ./scripts/lab up first}
    volumes:
      - object-data:/data
      - ./storage/start.sh:/start-storage.sh:ro
    tmpfs: [/tmp]
    mem_limit: 768m
    healthcheck:
      test: [CMD, sh, -c, "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  storage-init:
    <<: *backend
    command: [python, init_storage.py]
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      OBJECT_ADMIN_ACCESS_KEY: ${OBJECT_ADMIN_ACCESS_KEY:?Run ./scripts/lab up first}
      OBJECT_ADMIN_SECRET_KEY: ${OBJECT_ADMIN_SECRET_KEY:?Run ./scripts/lab up first}
    depends_on:
      objectstore:
        condition: service_healthy
    restart: "no"

  scanner:
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    platform: linux/amd64
    volumes:
      - clamav-data:/var/lib/clamav
    mem_limit: 4g
    healthcheck:
      test: [CMD-SHELL, "printf 'zPING\\0' | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 40
    restart: unless-stopped

  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run ./scripts/lab up first}
      POSTGRES_USER: ${POSTGRES_USER:?Run ./scripts/lab up first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/lab up first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  broker:
    image: rabbitmq:4.3.6-alpine@sha256:6931816af1a943f471c038b278835d36692d55dec769232739296bb91b7de0f5
    hostname: broker
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run ./scripts/lab up first}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./viewing/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./viewing/rabbitmq-management.conf:/etc/rabbitmq/conf.d/99-lab-management.conf:ro
    ports:
      - 127.0.0.1:15672:15672
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  viewer-init:
    <<: *backend
    command: [python, init_viewers.py]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run ./scripts/lab up first}
      POSTGRES_USER: ${POSTGRES_USER:?Run ./scripts/lab up first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/lab up first}
      POSTGRES_VIEWER_PASSWORD: ${POSTGRES_VIEWER_PASSWORD:?Run ./scripts/lab up first}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run ./scripts/lab up first}
      RABBITMQ_VIEWER_PASSWORD: ${RABBITMQ_VIEWER_PASSWORD:?Run ./scripts/lab up first}
      FLOWER_BROKER_PASSWORD: ${FLOWER_BROKER_PASSWORD:?Run ./scripts/lab up first}
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    restart: "no"

  flower:
    image: mher/flower:2.2.0@sha256:b4d3a7b1ed1bba28a32d9ad3c039571c74fe35c2d0ddb9ef7a8d42a3ca38b1bb
    command: [celery, --config=celeryconfig, flower, --conf=/etc/flower/flowerconfig.py]
    environment:
      PYTHONPATH: /etc/flower
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:?Run ./scripts/lab up first}
      FLOWER_BROKER_PASSWORD: ${FLOWER_BROKER_PASSWORD:?Run ./scripts/lab up first}
    ports:
      - 127.0.0.1:5555:5555
    volumes:
      - ./viewing/celeryconfig.py:/etc/flower/celeryconfig.py:ro
      - ./viewing/flowerconfig.py:/etc/flower/flowerconfig.py:ro
    depends_on:
      viewer-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/healthcheck', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 24
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.17@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    entrypoint: [/venv/bin/python3, /pgadmin-start.py]
    environment:
      PGADMIN_DEFAULT_EMAIL: lab@example.invalid
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Run ./scripts/lab up first}
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['invalid']"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGPASS_FILE: /tmp/pgpass
      POSTGRES_DB: ${POSTGRES_DB:?Run ./scripts/lab up first}
      POSTGRES_VIEWER_PASSWORD: ${POSTGRES_VIEWER_PASSWORD:?Run ./scripts/lab up first}
    ports:
      - 127.0.0.1:5050:5050
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./viewing/pgadmin-start.py:/pgadmin-start.py:ro
    depends_on:
      viewer-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/misc/ping', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped

  storage-viewer:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [admin, -master=objectstore:9333, -dataDir=/data, -iceberg.port=0, -lance.port=0]
    environment:
      WEED_ADMIN_USER: operator
      WEED_ADMIN_PASSWORD: ${STORAGE_ADMIN_PASSWORD:?Run ./scripts/lab up first}
      WEED_ADMIN_READONLY_USER: viewer
      WEED_ADMIN_READONLY_PASSWORD: ${STORAGE_VIEWER_PASSWORD:?Run ./scripts/lab up first}
    ports:
      - 127.0.0.1:23646:23646
    volumes:
      - storage-viewer-data:/data
    depends_on:
      objectstore:
        condition: service_healthy
    healthcheck:
      test: [CMD, sh, -c, "wget -q -O /dev/null http://127.0.0.1:23646/login"]
      interval: 5s
      timeout: 4s
      retries: 24
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 512m
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *backend
    environment:
      <<: *backend-environment
      DOCUMENT_ACCESS_KEY: ${OBJECT_WORKER_ACCESS_KEY:?Run ./scripts/lab up first}
      DOCUMENT_SECRET_KEY: ${OBJECT_WORKER_SECRET_KEY:?Run ./scripts/lab up first}
      LAB_SERVICE_NAME: worker
    command: [celery, -A, config, worker, --loglevel=WARNING, --concurrency=1, --hostname=worker@lab, --without-gossip, --without-mingle]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      provider:
        condition: service_healthy
      scanner:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import os,pathlib; os.kill(int(pathlib.Path('/tmp/resume-match-worker-ready').read_text()),0)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  provider:
    <<: *backend
    command: [python, local_converse.py]
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      LAB_SERVICE_NAME: provider
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?Run ./scripts/lab up first}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://openobserve:5080/api/default/v1/logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  relay:
    <<: *backend
    environment:
      <<: *backend-environment
      DOCUMENT_ACCESS_KEY: ${OBJECT_RELAY_ACCESS_KEY:?Run ./scripts/lab up first}
      DOCUMENT_SECRET_KEY: ${OBJECT_RELAY_SECRET_KEY:?Run ./scripts/lab up first}
      LAB_SERVICE_NAME: relay
    command: [python, manage.py, relay_jobs]
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/resume-match-relay-heartbeat').stat().st_mtime<15"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 127.0.0.1:8088:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  openobserve:
    build:
      context: .
      dockerfile: observability/Dockerfile
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_TELEMETRY: "false"
      ZO_ROOT_USER_EMAIL: lab@example.invalid
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?Run ./scripts/lab up first}
      ZO_COMPACT_DATA_RETENTION_DAYS: "3"
      ZO_COMPACT_DATA_RETENTION_INTERVAL: "3600"
      ZO_COMPACT_DELETE_FILES_DELAY_MINUTES: "120"
      ZO_MEM_TABLE_MAX_SIZE: "64"
      ZO_MAX_FILE_SIZE_IN_MEMORY: "16"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "256"
      ZO_MEMORY_CACHE_ENABLED: "false"
      ZO_DISK_CACHE_ENABLED: "false"
      ZO_RESULT_CACHE_ENABLED: "false"
      ZO_DISK_CIRCUIT_BREAKER_ENABLED: "true"
      ZO_DISK_CIRCUIT_BREAKER_THRESHOLD: "1024"
    ports:
      - 127.0.0.1:5080:5080
    volumes:
      - openobserve-data:/data
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, /busybox, wget, -q, -O, /dev/null, http://127.0.0.1:5080/healthz]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

volumes:
  object-data:
  clamav-data:
  postgres-data:
  rabbitmq-data:
  openobserve-data:
  pgadmin-data:
  storage-viewer-data:
