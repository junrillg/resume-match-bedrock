[project]
name = "resume-match-backend"
version = "0.1.0"
description = "Evidence-first resume matching architecture lab"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "boto3>=1.40,<2",
    "pypdf>=6.21,<7",
    "psycopg[binary,pool]>=3.3,<4",
    "gunicorn>=23,<24",
    "celery>=5.6,<6",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "redis==6.4.0",
    "uvicorn==0.35.0",
]

[tool.uv]
package = false
