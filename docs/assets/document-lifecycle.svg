<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="880" viewBox="0 0 1060 880" role="img" aria-labelledby="title desc"><title id="title">Durable document boundaries</title><desc id="desc">PostgreSQL reserves identity, SeaweedFS stores exact originals, then queued work and its outbox are finalized. A worker verifies and scans source before processing. Related owner operations reuse, download or delete the same document.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#37566b"/></marker></defs><rect width="1060" height="880" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173146}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#41596b}.path{fill:none;stroke:#37566b;stroke-width:2.4;marker-end:url(#arrow)}</style><text x="30" y="40" class="title">Durable document boundaries</text><text x="30" y="70" class="small">Local Compose · separate object/database commits · exact bytes stay private</text><rect x="30" y="110" width="300" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="48" y="145" class="label">2.1  Reserve identity</text><text x="48" y="186" class="body">PostgreSQL document + job</text><text x="48" y="211" class="body">SHA-256 + upload lease</text><text x="48" y="236" class="body">State: uploading; no outbox</text><rect x="380" y="110" width="300" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="398" y="145" class="label">2.2  Store original</text><text x="398" y="186" class="body">SeaweedFS S3-compatible</text><text x="398" y="211" class="body">PUT exact PDF/TXT or text</text><text x="398" y="236" class="body">Persistent private volume</text><rect x="730" y="110" width="300" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="748" y="145" class="label">2.3  Finalize admission</text><text x="748" y="186" class="body">PostgreSQL locks + commit</text><text x="748" y="211" class="body">Pending document; queued job</text><text x="748" y="236" class="body">Outbox now permits dispatch</text><path class="path" d="M330 185H378"/><path class="path" d="M680 185H728"/><path class="path" d="M880 260V295H180V328"/><rect x="30" y="330" width="300" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="48" y="365" class="label">3–4  Dispatch</text><text x="48" y="406" class="body">Relay → RabbitMQ quorum</text><text x="48" y="431" class="body">Persistent job UUID only</text><text x="48" y="456" class="body">Delivery may repeat</text><rect x="380" y="330" width="300" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="398" y="365" class="label">5  Verify source</text><text x="398" y="406" class="body">GET original; size/SHA check</text><text x="398" y="431" class="body">ClamAV clean gate</text><text x="398" y="456" class="body">Then parse or version cache</text><rect x="730" y="330" width="300" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="748" y="365" class="label">5–7  Produce outcome</text><text x="748" y="406" class="body">Converse → validate quotes</text><text x="748" y="431" class="body">Fenced score + report in DB</text><text x="748" y="456" class="body">React polls owner status</text><path class="path" d="M330 405H378"/><path class="path" d="M680 405H728"/><text x="30" y="535" class="label">Related owner operations · the same retained document</text><rect x="30" y="570" width="300" height="150" rx="10" fill="#f8f6f0" stroke="#8ba4b4"/><text x="48" y="605" class="label">Reuse / reprocess</text><text x="48" y="646" class="body">Owned source + requirements</text><text x="48" y="671" class="body">Reuse matching extraction</text><text x="48" y="696" class="body">Reprocess parses source again</text><rect x="380" y="570" width="300" height="150" rx="10" fill="#f8f6f0" stroke="#8ba4b4"/><text x="398" y="605" class="label">Download</text><text x="398" y="646" class="body">Ready + unexpired + owner</text><text x="398" y="671" class="body">Verify safety + checksum</text><text x="398" y="696" class="body">Attachment; private, no-store</text><rect x="730" y="570" width="300" height="150" rx="10" fill="#f8f6f0" stroke="#8ba4b4"/><text x="748" y="605" class="label">Delete / expire</text><text x="748" y="646" class="body">Tombstone + fence work</text><text x="748" y="671" class="body">Relay retries object removal</text><text x="748" y="696" class="body">Clean derived data + expiry</text><text x="30" y="767" class="small">202 uploading = reservation only; 202 queued = stored source and committed dispatch intent.</text><text x="30" y="799" class="small">Originals + extraction + results: 90-day project policy; earlier document deletion is available.</text><text x="30" y="831" class="small">Compare-delete keeps an established source; cancelling an unfinished upload leads to cleanup.</text><text x="30" y="860" class="small">ClamAV is the local gate. The separate AWS document view shows GuardDuty before object reads.</text></svg>