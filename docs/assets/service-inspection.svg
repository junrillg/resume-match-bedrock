<text x="88" y="204" class="body">Persistent job-reference delivery</text>
<text x="88" y="228" class="technical">resume.match.quorum</text>
<rect x="652" y="148" width="320" height="96" rx="8" fill="#fff" stroke="#8ba4b4"/>
