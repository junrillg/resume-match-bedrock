<rect x="420" y="288" width="204" height="24" fill="#fff"/><text x="428" y="304" class="small">Events via RabbitMQ</text>
<rect x="428" y="416" width="188" height="24" fill="#fff"/><text x="436" y="432" class="small">SELECT four tables</text>
<rect x="420" y="544" width="204" height="24" fill="#fff"/><text x="428" y="560" class="small">Cluster-wide reads</text>

<rect x="72" y="148" width="320" height="96" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/>
