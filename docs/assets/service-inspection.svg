<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="884" viewBox="0 0 1060 884" role="img" aria-labelledby="service-inspection-title service-inspection-desc">
<title id="service-inspection-title">Inspect local service boundaries</title>
<desc id="service-inspection-desc">RabbitMQ delivers UUID tasks to Celery while separate authenticated local viewers inspect queue metrics, task events, four database tables and privileged object storage. Dashed arrows show inspection or events; PostgreSQL remains the business ledger.</desc>
<defs>
<marker id="inspection-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#37566b"/></marker>
<marker id="inspection-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#173146"/></marker>
<marker id="inspection-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#37566b"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173146}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:16px;fill:#41596b}.technical{font-family:monospace;font-size:16px;fill:#41596b}.edge{fill:none;stroke:#37566b;stroke-width:2;marker-end:url(#inspection-arrow)}.inspect{stroke-dasharray:6 4}</style>
<rect width="1060" height="884" fill="#fff"/>
<text x="32" y="44" class="title">Inspect local service boundaries</text>
<text x="32" y="76" class="small">Local synthetic-data runtime · every viewer web listener binds 127.0.0.1</text>
<text x="72" y="120" class="technical">BUSINESS SERVICES</text>
<text x="652" y="120" class="technical">AUTHENTICATED VIEWERS</text>
