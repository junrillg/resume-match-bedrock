<text x="668" y="588" class="body">Privileged read-only operator</text>
<text x="668" y="612" class="technical">:23646/files · viewer</text>
<text x="72" y="676" class="small">OpenObserve :5080 correlates API, relay, worker and provider events.</text>
<text x="72" y="704" class="technical">ClamAV terminal: docker compose exec scanner clamdtop</text>
<text x="72" y="744" class="body">Flower SUCCESS means the wrapper returned; inspect the job for comparison success.</text>
<text x="72" y="772" class="body">Storage admin can read raw originals; application owner and scan gates do not apply.</text>
<line x1="32" y1="804" x2="1028" y2="804" stroke="#8ba4b4"/>
