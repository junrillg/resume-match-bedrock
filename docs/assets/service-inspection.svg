<text x="88" y="460" class="body">Document / Job / Outbox / Match</text>
<text x="88" y="484" class="technical">Authoritative business outcome</text>
<rect x="652" y="404" width="320" height="96" rx="8" fill="#fff" stroke="#8ba4b4"/>
<text x="668" y="432" class="label">pgAdmin</text>
<text x="668" y="460" class="body">Read-only application rows</text>
<text x="668" y="484" class="technical">:5050 · lab_viewer connection</text>
<rect x="72" y="532" width="320" height="96" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/>
