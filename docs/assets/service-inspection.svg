<text x="668" y="204" class="body">Queues, consumers and rates</text>
<text x="668" y="228" class="technical">:15672 · lab_monitor</text>
<rect x="72" y="276" width="320" height="96" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/>
<text x="88" y="304" class="label">Celery worker</text>
<text x="88" y="332" class="body">Process wrapper; emit task events</text>
<text x="88" y="356" class="technical">Remote control disabled</text>
<rect x="652" y="276" width="320" height="96" rx="8" fill="#fff" stroke="#8ba4b4"/>
<text x="668" y="304" class="label">Flower</text>
<text x="668" y="332" class="body">Transport task lifecycle</text>
<text x="668" y="356" class="technical">:5555/tasks · viewer</text>
