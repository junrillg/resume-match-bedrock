<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1145" viewBox="0 0 1060 1145" role="img" aria-labelledby="title desc">
  <title id="title">Inspect the local runtime</title>
  <desc id="desc">RabbitMQ Management inspects queue metrics, Flower observes transport task events, pgAdmin reads seven allowlisted application tables, Redis Commander inspects both Valkey shards, and the storage admin can read privileged original bytes. OpenObserve correlates safe lifecycle and delivery metadata.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#37566b" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#173146}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#41596b}.edge{fill:none;stroke:#37566b;stroke-width:2.3;marker-end:url(#arrow)}.wake{stroke-dasharray:6 5}</style>
  <rect width="1060" height="1145" fill="#fff" />
  <g id="connections">
    <path class="edge wake" d="M568 188L494 188" />
    <path class="edge wake" d="M568 363L494 363" />
    <path class="edge wake" d="M568 538L494 538" />
    <path class="edge wake" d="M568 713L494 713" />
    <path class="edge wake" d="M568 888L494 888" />
  </g>
  <g id="services">
    <g id="Queue">
      <rect x="32" y="120" width="460" height="135" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="159" class="label">RabbitMQ quorum</text>
      <text x="50" y="199" class="body">Persistent UUID deliveries</text>
      <text x="50" y="225" class="body">Separate from application result status</text>
    </g>
    <g id="BrokerView">
      <rect x="568" y="120" width="460" height="135" rx="10" fill="#f8f6f0" stroke="#8ba4b4" />
      <text x="586" y="159" class="label">RabbitMQ Management</text>
      <text x="586" y="199" class="body">:15672 · lab_monitor</text>
      <text x="586" y="225" class="body">Queue/consumer metrics; no queue payload access</text>
    </g>
    <g id="Worker">
      <rect x="32" y="295" width="460" height="135" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="334" class="label">Celery worker</text>
      <text x="50" y="374" class="body">Leased, idempotent application effects</text>
      <text x="50" y="400" class="body">Transport task events sent through RabbitMQ</text>
    </g>
    <g id="Flower">
      <rect x="568" y="295" width="460" height="135" rx="10" fill="#f8f6f0" stroke="#8ba4b4" />
      <text x="586" y="334" class="label">Flower</text>
      <text x="586" y="374" class="body">:5555 · read-only task history</text>
      <text x="586" y="400" class="body">Task SUCCESS differs from comparison outcome</text>
    </g>
    <g id="DB">
      <rect x="32" y="470" width="460" height="135" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="509" class="label">PostgreSQL</text>
      <text x="50" y="549" class="body">Job, document, result, outbox and inbox</text>
      <text x="50" y="575" class="body">Owner revision + StreamEvent delivery ledger</text>
    </g>
    <g id="PG">
      <rect x="568" y="470" width="460" height="135" rx="10" fill="#f8f6f0" stroke="#8ba4b4" />
      <text x="586" y="509" class="label">pgAdmin</text>
      <text x="586" y="549" class="body">:5050 · lab_viewer</text>
      <text x="586" y="575" class="body">SELECT seven allowlisted application tables</text>
    </g>
    <g id="Cache">
      <rect x="32" y="645" width="460" height="135" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="684" class="label">Two fixed Valkey shards</text>
      <text x="50" y="724" class="body">Owner-channel wakes + socket lease keys</text>
      <text x="50" y="750" class="body">Transient fan-out; durable replay lives in SQL</text>
    </g>
    <g id="CacheView">
      <rect x="568" y="645" width="460" height="135" rx="10" fill="#f8f6f0" stroke="#8ba4b4" />
      <text x="586" y="684" class="label">Redis Commander</text>
      <text x="586" y="724" class="body">:8089 · viewer</text>
      <text x="586" y="750" class="body">Both shards; scoped read-only Valkey ACL</text>
    </g>
    <g id="Original">
      <rect x="32" y="820" width="460" height="135" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="859" class="label">SeaweedFS originals</text>
      <text x="50" y="899" class="body">Stored source bytes, including quarantine</text>
      <text x="50" y="925" class="body">Application scan/owner gates remain separate</text>
    </g>
    <g id="StorageView">
      <rect x="568" y="820" width="460" height="135" rx="10" fill="#f8f6f0" stroke="#8ba4b4" />
      <text x="586" y="859" class="label">SeaweedFS admin</text>
      <text x="586" y="899" class="body">:23646 · privileged read-only operator</text>
      <text x="586" y="925" class="body">Cluster-wide reads include raw originals</text>
    </g>
  </g>
  <g id="annotations">
    <text x="32" y="42" class="title">Inspect the local runtime</text>
    <text x="32" y="74" class="small">Authenticated operator viewers · web listeners bind 127.0.0.1</text>
    <text x="32" y="1040" class="small">OpenObserve :5080 correlates API, job/event relays, worker, provider and gateway metadata using job/request IDs.</text>
    <text x="32" y="1066" class="small">Stream metrics expose connection, replay queue and database-work bounds; source bytes and credentials stay out of logs.</text>
    <text x="32" y="1092" class="small">ClamAV terminal inspection: docker compose exec scanner clamdtop</text>
  </g>
</svg>
