<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="970" viewBox="0 0 1060 970" role="img" aria-labelledby="title desc">
  <title id="title">One comparison, seven business steps</title>
  <desc id="desc">Submit to acceptance, durable outbox, confirmed queue, leased processing and atomic outcome. A durable owner event reaches React over SSE; targeted API reads return saved results. SQL transport and delivery are expanded in the focused views.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#37566b" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#173146}.title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#41596b}.edge{fill:none;stroke:#37566b;stroke-width:2.3;marker-end:url(#arrow)}.wake{stroke-dasharray:6 5}</style>
  <rect width="1060" height="970" fill="#fff" />
  <g id="connections">
    <path class="edge" d="M322 200L384 200" />
    <path class="edge" d="M676 200L738 200" />
    <path class="edge" d="M885 285L885 333" />
    <path class="edge" d="M740 420L678 420" />
    <path class="edge" d="M386 420L324 420" />
    <path class="edge" d="M177 505L177 540L531 540L531 573" />
    <path class="edge" d="M386 660L324 660" />
    <path class="edge wake" d="M531 285L531 310L353 310L353 555L177 555L177 573" />
  </g>
  <g id="services">
    <g id="Submit">
      <rect x="32" y="115" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="154" class="label">1  Submit</text>
      <text x="50" y="194" class="body">React + nginx :8088</text>
      <text x="50" y="220" class="body">Session, CSRF, retry key</text>
      <text x="50" y="246" class="body">Accepted work runs separately</text>
    </g>
    <g id="Accept">
      <rect x="386" y="115" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="404" y="154" class="label">2  Accept</text>
      <text x="404" y="194" class="body">Django: supply + owner checks</text>
      <text x="404" y="220" class="body">Reserve → upload → finalize</text>
      <text x="404" y="246" class="body">Queued Job + durable Outbox</text>
    </g>
    <g id="Relay">
      <rect x="740" y="115" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="758" y="154" class="label">3  Relay</text>
      <text x="758" y="194" class="body">Read committed dispatches</text>
      <text x="758" y="220" class="body">Reuse confirmed producer</text>
      <text x="758" y="246" class="body">Publish UUID; mark after confirm</text>
    </g>
    <g id="Queue">
      <rect x="740" y="335" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="758" y="374" class="label">4  Queue</text>
      <text x="758" y="414" class="body">RabbitMQ quorum queue</text>
      <text x="758" y="440" class="body">Persistent UUID deliveries</text>
      <text x="758" y="466" class="body">Retries preserve logical identity</text>
    </g>
    <g id="Process">
      <rect x="386" y="335" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="404" y="374" class="label">5  Process</text>
      <text x="404" y="414" class="body">Fetch clean source; parse/cache</text>
      <text x="404" y="440" class="body">Converse → validate quotes</text>
      <text x="404" y="466" class="body">Current lease fences completion</text>
    </g>
    <g id="Save">
      <rect x="32" y="335" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="374" class="label">6  Save</text>
      <text x="50" y="414" class="body">One PostgreSQL transaction</text>
      <text x="50" y="440" class="body">Outcome + report + inbox</text>
      <text x="50" y="466" class="body">Owner revision + StreamEvent</text>
    </g>
    <g id="Read">
      <rect x="32" y="575" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="50" y="614" class="label">7  Read</text>
      <text x="50" y="654" class="body">EventSource wakes React</text>
      <text x="50" y="680" class="body">GET affected state via Django</text>
      <text x="50" y="706" class="body">Open saved notification/result</text>
    </g>
    <g id="Delivery">
      <rect x="386" y="575" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="404" y="614" class="label">Delivery plane</text>
      <text x="404" y="654" class="body">Ledger → event-relay → shards</text>
      <text x="404" y="680" class="body">Raw ASGI gateway → SSE</text>
      <text x="404" y="706" class="body">Durable replay after reconnect</text>
    </g>
    <g id="Source">
      <rect x="740" y="575" width="290" height="170" rx="10" fill="#f0f7f8" stroke="#8ba4b4" />
      <text x="758" y="614" class="label">Source gate</text>
      <text x="758" y="654" class="body">SeaweedFS retains originals</text>
      <text x="758" y="680" class="body">ClamAV before parse/download</text>
      <text x="758" y="706" class="body">Local HTTP Converse provider</text>
    </g>
    <g id="Logs">
      <rect x="32" y="795" width="998" height="100" rx="10" fill="#f8f6f0" stroke="#8ba4b4" />
      <text x="50" y="834" class="label">Correlated operations</text>
      <text x="50" y="874" class="body">API, relays, worker, provider and gateway emit safe lifecycle metadata to OpenObserve OSS.</text>
    </g>
  </g>
  <g id="annotations">
    <text x="32" y="42" class="title">One comparison, seven business steps</text>
    <text x="32" y="74" class="small">Compose runtime · asynchronous work · durable originals, outcomes and browser delivery</text>
    <text x="190" y="531" class="small">Committed change</text>
    <text x="336" y="649" class="small">SSE</text>
    <text x="360" y="553" class="small">202 receipt</text>
    <text x="32" y="930" class="small">7 starts with the acceptance receipt and overlaps 3–6. Retries recover accepted work; new logical work can receive 429/503.</text>
  </g>
</svg>
