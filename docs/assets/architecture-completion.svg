<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="790" viewBox="0 0 1060 790" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">One comparison, seven steps</title><desc id="diagram-description">Local Compose runtime. Reserve document/job, store the original, then finalize queued job/outbox; relay a UUID to RabbitMQ; worker fetches, checks/scans source, invokes the local Converse contract and saves a fenced result. React reads durable status and the completion inbox; users can leave the processing page. Safe metadata reaches OpenObserve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#37566b"/></marker></defs><rect width="1060" height="790" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173146}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#41596b}.path{fill:none;stroke:#37566b;stroke-width:2.4;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style><text x="30" y="40" class="title">One comparison, seven steps</text><text x="30" y="70" class="small">Compose · durable originals + scanner · PostgreSQL owns lifecycle/results</text><rect x="30" y="105" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="48" y="140" class="label">1  Submit</text><text x="48" y="187" class="body">React + nginx :8088</text><text x="48" y="212" class="body">Session, CSRF, retry key</text><rect x="385" y="105" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="403" y="140" class="label">2  Accept</text><text x="403" y="187" class="body">Reserve → store original</text><text x="403" y="212" class="body">Then queued Job + Outbox</text><rect x="740" y="105" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="758" y="140" class="label">3  Relay</text><text x="758" y="187" class="body">Read committed outbox</text><text x="758" y="212" class="body">Publish UUID; wait for confirm</text><rect x="740" y="305" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="758" y="340" class="label">4  Queue</text><text x="758" y="387" class="body">RabbitMQ quorum queue</text><text x="758" y="412" class="body">Persistent UUID; redelivery</text><rect x="385" y="305" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="403" y="340" class="label">5  Process</text><text x="403" y="387" class="body">Fetch + scan + parse</text><text x="403" y="412" class="body">Converse → check quotes</text><rect x="30" y="305" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="48" y="340" class="label">6  Save</text><text x="48" y="387" class="body">Same PostgreSQL database</text><text x="48" y="412" class="body">Outcome + report + notice</text><rect x="30" y="520" width="290" height="125" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="48" y="555" class="label">7  Read</text><text x="48" y="602" class="body">Background status + inbox</text><text x="48" y="627" class="body">Processing → result route</text><path class="path" d="M320 168H383"/><path class="path" d="M675 168H738"/><path class="path" d="M885 230V303"/><path class="path" d="M740 368H677"/><path class="path" d="M385 368H322"/><rect x="385" y="520" width="290" height="150" rx="10" fill="#f0f7f8" stroke="#8ba4b4"/><text x="403" y="555" class="label">HTTP Converse contract</text><text x="403" y="602" class="body">boto3 → provider:8090</text><text x="403" y="627" class="body">Deterministic source quotes</text><text x="403" y="652" class="body">No model/IAM emulation</text><path class="path" d="M515 430V518"/><path class="path" d="M560 520V432"/><text x="400" y="480" class="small">5.4 HTTP</text><rect x="740" y="520" width="290" height="150" rx="10" fill="#f8f6f0" stroke="#8ba4b4"/><text x="758" y="555" class="label">Safe process logs</text><text x="758" y="602" class="body">API + relay + worker</text><text x="758" y="627" class="body">+ HTTP provider →</text><text x="758" y="652" class="body">OpenObserve OSS :5080</text><path class="path dashed" d="M675 592H738"/><text x="700" y="490" class="small">Metadata only</text><path class="path dashed" d="M175 520V465H345V258H500V232"/><text x="30" y="690" class="small">7 starts after the receipt: continue working; open the saved completion notice.</text><text x="30" y="730" class="small">Solid: work/API handoff. Dashed: concurrent reads or safe telemetry.</text><text x="30" y="757" class="small">Provider calls and delivery can repeat; only current claims can commit a report.</text></svg>