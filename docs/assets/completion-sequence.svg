<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title description"><title id="title">Nonblocking completion journey</title><desc id="description">The API acknowledges durable admission before the worker finishes. The user can navigate freely. Worker outcome and notification commit together. Background reads return saved state; only the same processing page auto-opens its result. Elsewhere a notification links to the result without changing the draft.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#37566b"/></marker></defs><rect width="1120" height="900" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173146}.title{font-size:27px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#41596b}.call{fill:none;stroke:#37566b;stroke-width:2;marker-end:url(#arrow)}.return{stroke-dasharray:7 5}.life{stroke:#a1b1bb;stroke-width:1.5;stroke-dasharray:5 6}</style><text x="30" y="40" class="title">Work continues. The user can, too.</text><text x="30" y="70" class="small">Local execution · acceptance, processing, persistent notification and result access</text><rect x="20" y="100" width="190" height="50" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="35" y="131" class="label">React browser</text><path class="life" d="M115 150V655"/><rect x="305" y="100" width="190" height="50" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="320" y="131" class="label">Django API</text><path class="life" d="M400 150V655"/><rect x="605" y="100" width="190" height="50" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="620" y="131" class="label">PostgreSQL</text><path class="life" d="M700 150V655"/><rect x="895" y="100" width="190" height="50" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="910" y="131" class="label">Worker / recovery</text><path class="life" d="M990 150V655"/><path class="call " d="M115 190H400"/><text x="127" y="178" class="body">1–2  POST + retry key</text><path class="call " d="M400 240H700"/><text x="412" y="228" class="body">Durable admission</text><path class="call return" d="M400 290H115"/><text x="127" y="278" class="body">202 queued + job ID</text><rect x="25" y="315" width="430" height="55" rx="8" fill="#edf4eb" stroke="#8ba4b4"/><text x="40" y="340" class="label">7.1  /jobs/id · leave or start another</text><text x="40" y="359" class="small">No worker wait in the admission request</text><rect x="800" y="315" width="295" height="55" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="815" y="339" class="label">3–5  Independent processing</text><text x="815" y="359" class="small">Dispatch, claim, verify and score</text><path class="call " d="M990 420H700"/><text x="712" y="408" class="body">6  Outcome + notice</text><rect x="600" y="440" width="450" height="48" rx="8" fill="#edf4eb" stroke="#8ba4b4"/><text x="615" y="470" class="label">One DB transaction · one notice per job</text><path class="call " d="M115 530H400"/><text x="127" y="518" class="body">7.2  Background GET</text><path class="call " d="M400 570H700"/><text x="412" y="558" class="body">Owned status + inbox</text><path class="call return" d="M700 605H400"/><text x="412" y="593" class="body">Saved state</text><path class="call return" d="M400 650H115"/><text x="127" y="638" class="body">JSON + unread count</text><rect x="25" y="665" width="510" height="135" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="43" y="697" class="label">7.3  Same processing page</text><text x="43" y="731" class="body">Success → /results/id</text><text x="43" y="761" class="body">Only while that job is still being viewed</text><text x="43" y="785" class="small">Failure stays visible with safe recovery</text><rect x="565" y="665" width="530" height="135" rx="8" fill="#f0f7f8" stroke="#8ba4b4"/><text x="583" y="697" class="label">7.3  User is elsewhere</text><text x="583" y="731" class="body">Preserve the page and unsaved draft</text><text x="583" y="761" class="body">Open saved notification → result or failure</text><text x="583" y="785" class="small">Read acknowledgement never gates result access</text><text x="30" y="839" class="small">Visible/online: bounded background checks. Closed/offline: catch up on return.</text><text x="30" y="870" class="small">Solid = call / durable write. Dashed = return. Notifications are saved in-app.</text></svg>