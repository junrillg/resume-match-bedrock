worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        ${FRONTEND_PROTO_RULE}
    }

    # API recreation can change its Docker IP while nginx keeps serving the same UI.
    upstream django_api {
        zone django_api 64k;
        resolver ${FRONTEND_DNS_RESOLVER} valid=5s ipv6=off;
        server ${FRONTEND_API_UPSTREAM} resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1100000;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location /api/ {
            proxy_pass http://django_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 65s;
        }

        location / { try_files $uri $uri/ /index.html; }
    }
}
